<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>forgot your password. · Come to Jesus.</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4eadb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #f4eadb;
      --bg-soft: #f9f1e3;
      --ink: #1c1409;
      --ink-mid: #3a2c18;
      --ink-soft: #5a4a32;
      --ink-whisper: #8a7a5a;
      --error: #b8412e;
      --success: #4a7548;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      padding: 48px 36px;
    }
    .title {
      font-family: 'Fraunces', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-variation-settings: "opsz" 72;
      font-size: 40px;
      letter-spacing: -0.015em;
      margin: 0 0 24px 0;
      line-height: 1.1;
    }
    .body {
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink-mid);
      margin: 0 0 32px 0;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      color: var(--ink);
      background: var(--bg-soft);
      border: 1px solid rgba(28, 20, 9, 0.15);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .field input:focus {
      border-color: var(--ink-mid);
    }
    .submit {
      width: 100%;
      padding: 14px 20px;
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: 24px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s ease;
    }
    .submit:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .submit:hover:not(:disabled) {
      opacity: 0.92;
    }
    .message {
      margin: 16px 0 0 0;
      font-size: 15px;
      line-height: 1.5;
      font-style: italic;
      color: var(--ink-soft);
    }
    .message.error { color: var(--error); }
    .message.success { color: var(--success); }
    .footer-link {
      margin-top: 28px;
      font-size: 14px;
      font-style: italic;
      text-align: center;
      color: var(--ink-soft);
    }
    .footer-link a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(28, 20, 9, 0.2);
      padding-bottom: 1px;
    }
    .footer-link a:hover {
      border-bottom-color: var(--ink);
    }
  </style>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1 class="title" id="title">forgot your password.</h1>
      <p class="body" id="body">enter the email tied to your account. we'll send you a link to set a new one.</p>

      <form id="form">
        <div class="field">
          <label for="email">email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="submit" id="submitBtn">send reset link</button>
      </form>

      <div class="message" id="message"></div>

      <div class="footer-link">
        <a href="/login.html"><i class="fa-solid fa-arrow-left"></i> back to sign in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://hatyoorjnakvgtuvwzhv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdHlvb3JqbmFrdmd0dXZ3emh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5OTExMjgsImV4cCI6MjA5MjU2NzEyOH0.OXtoqNb8ikORBfoOKiweJd-xRdp8FdBsorUhfupWYXg';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
    });

    const formEl = document.getElementById('form');
    const emailEl = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');

    function showMessage(text, kind) {
      messageEl.textContent = text;
      messageEl.className = 'message' + (kind ? ' ' + kind : '');
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailEl.value.trim();
      if (!email) {
        showMessage('please enter your email.', 'error');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'sending...';

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password.html'
        });
        if (error) {
          showMessage(error.message || 'something went wrong. try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        } else {
          // Generic success regardless of whether email exists, to avoid leaking
          // which addresses are registered. Supabase only sends if the account exists.
          showMessage('check your email. if an account exists, a reset link is on the way.', 'success');
          submitBtn.textContent = 'sent';
        }
      } catch (err) {
        showMessage('something came between us. try again in a moment.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  </script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
